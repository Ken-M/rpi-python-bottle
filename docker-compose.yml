services:
  redis:
    image: redis:latest
    container_name: redis
    # ループバック限定でホストへ公開する（LAN・外部へは公開しない）。
    # 同一 Pi 上でホスト直動作する Freenove ケースキットのタスク
    # （power_state.py が localhost:6379 を参照）が電力データを読むために必要。
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    networks:
      app_net:
        ipv4_address: 172.19.0.5
    restart: always

  measure-application:
      container_name: rpi-python-bottle-app-measure
      image: kenonemorita/rpi-python-bottle-app-measure
      build: ./app_measure
      depends_on:
        redis:
          condition: service_healthy
      tty: false
      volumes:
       - ./app_measure:/home/bottle/app
       - ./shared_config.py:/home/bottle/app/shared_config.py:ro
      group_add:
       - "20"   # ホスト側 dialout GID（Raspberry Pi OS デフォルト）
      devices:
       - "/dev/ttyUSB0:/dev/ttyUSB0:rwm"
      entrypoint:
       - /usr/local/bin/python3
       - /home/bottle/app/get-power.py
      privileged: true
      cap_add:
       - SYS_RAWIO
      networks:
        app_net:
          ipv4_address: 172.19.0.10

      logging:
        driver: "json-file" # defaults if not specified
        options:
          max-size: "10m"
          max-file: "5"
      restart: always

  my_flask_app:
      build:
        context: ./my_flask_app
      image: kenonemorita/rpi-python-bottle-my-flask-app
      container_name: my_flask_app
      depends_on:
        redis:
          condition: service_healthy
      volumes:
       - ./my_flask_app:/app
       - ./shared_config.py:/app/shared_config.py:ro
      entrypoint:
       - /usr/local/bin/gunicorn
       - --workers=2
       - --bind=0.0.0.0:5000
       - --chdir=/app
       - my_flask_app:app
      ports:
        - "5000:5000"  # Flask用のポートを公開
      networks:
        app_net:
          ipv4_address: 172.19.0.15  # 固定IPアドレスを割り当てる
      restart: always

  ngrok:
    image: ngrok/ngrok:latest
    restart: unless-stopped
    command:
      - "start"
      - "--all"
      - "--config"
      - "/etc/ngrok.yml"
    ports:
      - 4040:4040
    volumes:
      - ./ngrok/ngrok.yml:/etc/ngrok.yml
    networks:
      app_net:
        ipv4_address: 172.19.0.20

networks:
  app_net:
    driver: bridge
    ipam:
     driver: default
     config:
       - subnet: 172.19.0.0/16
